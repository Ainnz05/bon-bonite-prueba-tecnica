serenity.project.name=Bon-Bonite - Prueba Técnica QA Automation Screenplay
serenity.test.root=com.qvision.bonbonite
serenity.take.screenshots=FOR_FAILURES
serenity.report.encoding=UTF-8
serenity.compress.filenames=true

webdriver.driver=chrome
webdriver.autodownload=true
webdriver.base.url=https://www.bon-bonite.com/
webdriver.wait.for.timeout=15000
webdriver.timeouts.implicitlywait=0

chrome.switches=--start-maximized;--disable-notifications;--disable-popup-blocking
